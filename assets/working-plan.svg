  <text x="67" y="1205" class="label">Откуда числа</text>
  <text x="67" y="1240" class="foot">333 — подпись на плане аналога.</text>
  <text x="67" y="1272" class="foot">≈ — расчёт по модели. ? — спорная подпись.</text>
  <text x="67" y="1311" class="foot">Размер стены включает проёмы между её углами.</text>
  <text x="661" y="1205" class="label">Что уточнить рулеткой</text>
  <text x="661" y="1240" class="foot">В ванной подпись читается как 227 см, возможно 237 см.</text>
  <text x="661" y="1272" class="foot">Рыжим показана стена от ступени у щитков до санузла Б.</text>
  <text x="661" y="1304" class="foot">В модели ступень 17 см. Проверить глубину и длину стены.</text>
