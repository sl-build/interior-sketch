<svg xmlns="http://www.w3.org/2000/svg" width="2190" height="2040" viewBox="0 0 1460 1360" role="img" aria-labelledby="title desc">
  <title id="title">Длина каждой стены в сантиметрах</title>
  <desc id="desc">Числа нанесены вдоль соответствующих стен, с засечками на обоих концах. Окна наверху, вход внизу. Основа — план аналога и рабочая модель до обмера.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#233b34}
    .kicker{font-size:17px;font-weight:bold;letter-spacing:1.6px;fill:#4d6759}
    .title{font-size:54px;font-weight:bold}.sub{font-size:23px;fill:#405a50}
    .room{font-size:24px;font-weight:bold}.smallroom{font-size:20px;font-weight:bold}.note{font-size:15px;fill:#50665b}
    .wall{fill:none;stroke:#344c44;stroke-width:4.4;stroke-linecap:square}
    .window{fill:none;stroke:#387e88;stroke-width:5}.radiator{fill:#c6d8d5;stroke:#779c99;stroke-width:1}
    .dl,.ext{fill:none;stroke:#507c98;stroke-width:1.05}.ext{stroke-width:.8}
    .dv{fill:#194b6d;font-weight:bold;text-anchor:middle}.label{font-weight:bold;font-size:22px}
    .foot{font-size:20px;fill:#40574b}.rule{stroke:#ccd4ca;stroke-width:1.3}
  </style>
