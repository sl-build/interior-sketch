    <path id="switch" d="M0 -6l6 6 -6 6 -6 -6Z" fill="#faf2df" stroke="#a15537" stroke-width="2"/>
  </defs>
  <rect width="1460" height="1360" fill="#f9f8f2"/>
  <text x="67" y="49" class="kicker">РАБОЧИЙ ПЛАН</text>
  <text x="1390" y="49" text-anchor="end" class="kicker">ПОТОЛОК 268 СМ</text>
  <text x="64" y="117" class="title">Длины стен</text>
  <text x="67" y="164" class="sub">Все размеры в сантиметрах. Каждая синяя линия идёт от одной засечки до другой.</text>
