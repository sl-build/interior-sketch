<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-labelledby="title">
  <title id="title">Два санузла. Расположение приборов со стороны входа</title>
  <style>text{font-family:Arial,sans-serif;fill:#2e443b}.h{font-size:23px;font-weight:bold}.s{font-size:15px}.wall{fill:#eee9de;stroke:#505e55;stroke-width:4}.ceramic{fill:#fffdfa;stroke:#8e9e97;stroke-width:2}.water{fill:#d7e6e3;stroke:#8e9e97}.metal{fill:none;stroke:#638987;stroke-width:4}</style>
  <rect width="900" height="490" fill="#f8f7f1"/>
  <text x="36" y="45" class="h">Санузлы по видеообходу</text>
  <text x="36" y="75" class="s">Вход в обе комнаты показан снизу. Положение приборов ориентировочное.</text>
  <g transform="translate(58 144)">
    <text x="0" y="-23" class="h">А · туалет у кухни</text>
    <path class="wall" d="M79 207H0V0H265V207H167"/>
    <path d="M34 5h57m169 74v65" class="metal"/>
    <rect x="80" y="7" width="45" height="21" rx="5" class="ceramic"/>
    <ellipse cx="103" cy="49" rx="23" ry="31" class="ceramic"/>
    <ellipse cx="204" cy="28" rx="29" ry="22" class="ceramic"/>
    <text x="166" y="68" class="s">раковина</text>
    <text x="24" y="115" class="s">унитаз</text>
    <text x="125" y="236" class="s" text-anchor="middle">↑ вход</text>
  </g>
  <g transform="translate(466 144)">
    <text x="0" y="-23" class="h">Б · ванная у спальни</text>
    <path class="wall" d="M85 256H0V0H284V256H173"/>
    <rect x="3" y="4" width="212" height="82" rx="3" class="ceramic"/>
    <rect x="10" y="12" width="197" height="62" rx="14" class="water"/>
    <text x="108" y="50" class="s" text-anchor="middle">ванна</text>
    <rect x="217" y="3" width="64" height="48" fill="#d9d7cd"/>
    <ellipse cx="30" cy="120" rx="27" ry="23" class="ceramic"/>
    <text x="69" y="126" class="s">раковина</text>
    <rect x="4" y="179" width="18" height="43" rx="4" class="ceramic"/>
    <ellipse cx="44" cy="201" rx="29" ry="22" class="ceramic"/>
    <text x="82" y="204" class="s">унитаз</text>
    <path d="M5 170v53m272 -82V87" class="metal"/>
    <text x="266" y="157" class="s" text-anchor="end">змеевик</text>
    <text x="266" y="176" class="s" text-anchor="end">и радиатор</text>
    <text x="131" y="283" class="s" text-anchor="middle">↑ вход</text>
  </g>
  <text x="58" y="459" class="s">Люки отмечены у стен. Габариты коробов и точные привязки уточняются обмером.</text>
</svg>
